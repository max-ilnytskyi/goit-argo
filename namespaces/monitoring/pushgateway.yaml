apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
  namespace: infra-tools
spec:
  project: default

  source:
    chart: prometheus-pushgateway
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 3.6.1
    helm:
      releaseName: pushgateway
      valuesObject:
        fullnameOverride: pushgateway

        service:
          type: ClusterIP
          port: 9091

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true